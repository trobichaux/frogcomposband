name: Build macOS

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: [master]
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to publish, for example v7.1.salmiak-macos-r8
        required: true
        type: string

jobs:
  build:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install Xcode Command Line Tools
        run: xcode-select --install 2>/dev/null || true

      - name: Determine release metadata
        id: meta
        run: |
          VERSION=$(grep '^VERSION' src/Makefile.src | head -1 | cut -d= -f2 | tr -d ' \r')
          DMG_NAME="FrogComposband-${VERSION}-osx.dmg"

          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG_NAME="${{ github.event.inputs.release_tag }}"
            RELEASE_MODE=true
          elif [[ "$GITHUB_REF" == refs/tags/* ]]; then
            TAG_NAME="${GITHUB_REF#refs/tags/}"
            RELEASE_MODE=true
          else
            TAG_NAME=""
            RELEASE_MODE=false
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "dmg_name=$DMG_NAME" >> "$GITHUB_OUTPUT"
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "release_mode=$RELEASE_MODE" >> "$GITHUB_OUTPUT"

      - name: Build app bundle
        run: cd src && make -f Makefile.osx

      # Sign and notarize only on tag pushes (releases), not PRs or branch pushes
      - name: Import Developer ID certificate
        if: steps.meta.outputs.release_mode == 'true'
        env:
          APPLE_CERT_DATA: ${{ secrets.APPLE_CERT_DATA }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
        run: |
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          CERT_PATH=$RUNNER_TEMP/cert.p12
          echo "$APPLE_CERT_DATA" | base64 --decode -o "$CERT_PATH"
          security create-keychain -p "" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -k "$KEYCHAIN_PATH" -P "$APPLE_CERT_PASSWORD" -T /usr/bin/codesign
          security list-keychain -d user -s "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "" "$KEYCHAIN_PATH"

      - name: Sign and package .dmg
        if: steps.meta.outputs.release_mode == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
        run: |
          SIGNING_IDENTITY="${APPLE_SIGNING_IDENTITY:-Developer ID Application: TIMOTHY D ROBICHAUX ($APPLE_TEAM_ID)}"

          # Sign the app (must happen before packaging into .dmg)
          codesign --deep --force --options runtime \
            --sign "$SIGNING_IDENTITY" \
            --entitlements src/cocoa/FrogComposband.entitlements \
            FrogComposband.app
          codesign --verify --deep --strict --verbose=4 FrogComposband.app 2>&1

          VERSION="${{ steps.meta.outputs.version }}"
          DMG_NAME="${{ steps.meta.outputs.dmg_name }}"

          # Package the already-signed app into a .dmg
          mkdir -p disttemp/Docs
          cp readme.txt disttemp/Docs
          cp -R FrogComposband.app disttemp/
          hdiutil create -quiet -fs HFS+ -volname "FrogComposband-${VERSION}" \
            -srcfolder disttemp disttemp.dmg
          hdiutil convert disttemp.dmg -quiet -format UDZO \
            -imagekey zlib-level=6 -o "$DMG_NAME"
          rm -rf disttemp disttemp.dmg

          # Sign the .dmg itself (required for notarization)
          codesign --force \
            --sign "$SIGNING_IDENTITY" \
            "$DMG_NAME"

      - name: Notarize .dmg
        if: steps.meta.outputs.release_mode == 'true'
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          DMG="${{ steps.meta.outputs.dmg_name }}"
          SUBMISSION=$(xcrun notarytool submit "$DMG" \
            --apple-id "$APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --wait --output-format json)
          echo "$SUBMISSION"
          STATUS=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin)['status'])")
          ID=$(echo "$SUBMISSION" | python3 -c "import sys,json; print(json.load(sys.stdin)['id'])")
          if [ "$STATUS" != "Accepted" ]; then
            echo "Notarization failed with status: $STATUS"
            xcrun notarytool log "$ID" \
              --apple-id "$APPLE_ID" \
              --team-id "$APPLE_TEAM_ID" \
              --password "$APPLE_APP_PASSWORD"
            exit 1
          fi
          xcrun stapler staple "$DMG"

      - name: Upload .dmg to release
        if: steps.meta.outputs.release_mode == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ steps.meta.outputs.tag_name }}"
          DMG="${{ steps.meta.outputs.dmg_name }}"
          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            gh release edit "$TAG_NAME" --title "$TAG_NAME" --notes-file RELEASE_NOTES.md
            gh release upload "$TAG_NAME" "$DMG" --clobber
          else
            gh release create "$TAG_NAME" "$DMG" --title "$TAG_NAME" --notes-file RELEASE_NOTES.md
          fi
